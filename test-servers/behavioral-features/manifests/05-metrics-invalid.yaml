---
# Test Case: Prometheus metrics - invalid MCPServer (PR #122)
# Scenario: An MCPServer referencing a non-existent ConfigMap should produce
#   validation_failures_total counter and condition_info with Accepted=False
apiVersion: mcp.x-k8s.io/v1alpha1
kind: MCPServer
metadata:
  name: metrics-test-invalid
  namespace: default
spec:
  source:
    type: ContainerImage
    containerImage:
      ref: localhost/operator-features-validator:local
  config:
    port: 8080
    storage:
      - path: /config
        permissions: ReadOnly
        source:
          type: ConfigMap
          configMap:
            name: this-configmap-does-not-exist-for-metrics
