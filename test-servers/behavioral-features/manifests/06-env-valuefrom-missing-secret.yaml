---
# Test Case: Env valueFrom validation - missing Secret (PR #103)
# Scenario: An MCPServer with env[].valueFrom.secretKeyRef referencing a
#   non-existent Secret should get Accepted=False, Invalid
apiVersion: mcp.x-k8s.io/v1alpha1
kind: MCPServer
metadata:
  name: env-valuefrom-missing-secret
  namespace: default
spec:
  source:
    type: ContainerImage
    containerImage:
      ref: localhost/operator-features-validator:local
  config:
    port: 8080
    env:
      - name: MY_SECRET_VAR
        valueFrom:
          secretKeyRef:
            name: this-secret-does-not-exist-for-valuefrom
            key: some-key
