---
# Test Case: Env valueFrom validation - optional secretKeyRef (PR #103)
# Scenario: An MCPServer with env[].valueFrom.secretKeyRef referencing a
#   non-existent Secret but with optional: true should get Accepted=True, Valid
apiVersion: mcp.x-k8s.io/v1alpha1
kind: MCPServer
metadata:
  name: env-valuefrom-optional-secret
  namespace: default
spec:
  source:
    type: ContainerImage
    containerImage:
      ref: localhost/operator-features-validator:local
  config:
    port: 8080
    env:
      - name: MY_OPTIONAL_VAR
        valueFrom:
          secretKeyRef:
            name: this-secret-does-not-exist-optional
            key: some-key
            optional: true
