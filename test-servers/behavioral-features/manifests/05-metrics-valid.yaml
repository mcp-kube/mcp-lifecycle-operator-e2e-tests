---
# Test Case: Prometheus metrics - valid MCPServer (PR #122)
# Scenario: A valid MCPServer should produce condition_info metrics with Accepted=True, Ready=Available
apiVersion: mcp.x-k8s.io/v1alpha1
kind: MCPServer
metadata:
  name: metrics-test-valid
  namespace: default
spec:
  source:
    type: ContainerImage
    containerImage:
      ref: localhost/operator-features-validator:local
  config:
    port: 8080
  runtime:
    security:
      podSecurityContext:
        runAsUser: 1000
        runAsGroup: 3000
